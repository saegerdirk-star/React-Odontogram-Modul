name: Publish to npm

# Publishes the library when a version tag (e.g. v1.51.0) is pushed, or on a
# manual run (workflow_dispatch) — the latter is handy for publishing without a
# new version/tag (e.g. re-publishing the current version under a new package
# name). Publishes only to the internal Cognovis registry and requires an
# NPM_TOKEN secret with publish rights in the repository settings. `npm publish`
# runs the `prepublishOnly` script, which rebuilds the library, so the tarball
# always reflects the source.
#
# Do not set setup-node registry-url to npm.cognovis.de. That rewrites the
# whole job (including `npm ci`) onto Verdaccio with always-auth, so an
# invalid NPM_TOKEN fails the public lockfile install with E401 before
# publish runs. Auth is applied only to the publish step.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify build + tests before publishing
        run: |
          npx tsc -b --noEmit
          npm test
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if test -z "$NODE_AUTH_TOKEN"; then
            echo "NPM_TOKEN secret is empty" >&2
            exit 1
          fi
          userconfig="${RUNNER_TEMP}/npmrc-publish"
          printf '%s\n' "//npm.cognovis.de/:_authToken=${NODE_AUTH_TOKEN}" > "$userconfig"
          npm publish --registry=https://npm.cognovis.de/ --userconfig "$userconfig"
